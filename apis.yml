aid: curve
name: Curve
description: Curve is a London-based fintech, founded in 2015 by Shachar Bialick, that consolidates
  multiple debit and credit cards into a single smart card and mobile wallet. Its "over-the-top"
  banking platform lets customers spend from any linked Mastercard or Visa card, switch the funding
  source of a past purchase up to 120 days later with "Go Back in Time", avoid foreign-exchange fees,
  earn cashback, and pay in instalments with Curve Flex. Premium tiers (Curve Pay X / Pro / Pro+) add
  insurance, lounge access, and richer rewards. Curve is backed by Seedcamp and Speedinvest among
  others. Curve does not publish a public developer API — it acts as an open-banking consumer to
  aggregate customer account balances rather than exposing a provider API.
